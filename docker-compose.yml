version: '3.8'

services:
  omni-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omni-context-gateway
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - OFFLINE_MOCK_MODE=true
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  omni-cockpit:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omni-context-cockpit
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      omni-gateway:
        condition: service_healthy
    restart: unless-stopped
